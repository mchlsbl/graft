<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAFT v2.7</title>
  <link rel="stylesheet" href="style.css">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDLjPD40IRs_HW-Z-l7Md6GxNSxKR9p5Pk",
    authDomain: "graft-scoreboard.firebaseapp.com",
    projectId: "graft-scoreboard",
    storageBucket: "graft-scoreboard.firebasestorage.app",
    messagingSenderId: "640180014623",
    appId: "1:640180014623:web:d56045e687c5841fb44f2a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Udostępniamy obiekty do okna globalnego
  window.db = db;
  window.doc = doc;
  window.setDoc = setDoc;
  window.onSnapshot = onSnapshot;

  // Aktywujemy nasłuch natychmiast po gotowości Firebase
  if (typeof window.startFirebaseListener === 'function') {
    window.startFirebaseListener();
  }
</script>

</head>
<body>

<div class="app-container">
  <h1> graft scoreboard</h1>

  <!-- Player Switcher -->
  <div class="player-bar" id="playerBar"></div>

 <!-- Section 1: cargo -->
<div class="section sec-cargo">
    <div class="section-title">cargo</div>
    <form class="cargo-input-group" onsubmit="event.preventDefault(); addManifest();">
      <input type="number" id="cargoValue" placeholder="Score for each completed cargo." min="-50">
      <button type="submit" class="button">+</button>
    </form>
    
    <div class="cargo-list" id="cargoList"></div>
  </div>

  <!-- Section 2: Badges -->
  <div class="section sec-badges">
    <div class="section-title">Badges</div>
    <div class="badge-row" id="goldBadges"></div>
    <div class="badge-row" id="silverBadges"></div>
  </div>

  <!-- Section 3: Compost -->
  <div class="section sec-compost">
    <div class="section-title">Compost</div>
<div class="compost-row">
    <label style="font-size: 18px; font-weight: bold;">Number of cards in compost pile:</label>
    <input type="number" id="compostCards" value="0" min="0" onchange="updateCurrentPlayerCompost()" style="margin-top: 4px;">
    </div>  
    <label style="font-size: 18px; font-weight: bold; margin-top: 8px; display: block;">Card Value (Increased by shipped Recycle cards):</label>
    <div class="multiplier-selector">
      <div class="mult-btn selected" onclick="setCompostMult(1)">1</div>
      <div class="mult-btn" onclick="setCompostMult(2)">2</div>
      <div class="mult-btn" onclick="setCompostMult(3)">3</div>
      <div class="mult-btn" onclick="setCompostMult(4)">4</div>
    </div>
  </div>

  <button class="calc-btn" onclick="calculateScores()">SUBMIT</button>

  <!-- Leaderboard -->
  <div class="section" id="resultsSection" style="display: none;">
    <div class="section-title" style="background: #3B3A54; color: white;">Final Results</div>
    <table class="results-table">
      <thead>
        <tr>
          <th>Player</th>
          <th>Cargo</th>
          <th>Badges</th>
          <th>Compost</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<script>
  const colors = [
    { name: 'Shrimp', hex: 'var(--shrimp)' },
    { name: 'Chicken', hex: 'var(--chicken)' },
    { name: 'Cow', hex: 'var(--cow)' },
    { name: 'Sheep', hex: 'var(--sheep)' },
    { name: 'Crab', hex: 'var(--crab)' }
  ];

  // State for 5 players
  let players = colors.map((c, i) => ({
    id: i,
    color: c.name,
    hex: c.hex,
    cargo: [],
    badges: {
      gold: [null, null],
      silver: [null, null, null]
    },
    compostCount: 0,
    compostMult: 1
  }));

  let activePlayerIndex = -1;

  function init() {
    renderPlayerBar();
    renderBadgesUI();
  }

  // --- FIRESTORE FUNCTIONS ---
async function saveGameState() {
  // Jeśli właśnie trwa aktualizacja z serwera - NIE ZAPISUJ!
  if (isRemoteUpdating || !window.db) return;

  try {
    await window.setDoc(window.doc(window.db, "games", "game_save"), {
      players: players,
      updatedAt: new Date()
    });
    console.log("Zapisano w Firebase!");
  } catch (e) {
    console.error("Błąd zapisu:", e);
  }
}

// Flaga zapobiegająca pętli
let isRemoteUpdating = false;
window.startFirebaseListener = function() {
  if (!window.db) return;
  window.onSnapshot(window.doc(window.db, "games", "game_save"), (docSnapshot) => {
    if (docSnapshot.exists()) {
      const data = docSnapshot.data();
      if (data.players) {
        // 1. Włączamy blokadę zapisu na czas aktualizacji UI
        isRemoteUpdating = true;
        players = data.players;
        loadPlayerForm();
        calculateScores(false); // Wyświetl wyniki bez zapisu
        // 2. Wyłączamy blokadę tuż po zakończeniu rysowania UI
        setTimeout(() => {
          isRemoteUpdating = false;
        }, 100);
      }
    }
  });
};

  // --- UI & LOGIC ---
  function renderPlayerBar() {
    const bar = document.getElementById('playerBar');
    bar.innerHTML = '';
    players.forEach((p, index) => {
      const btn = document.createElement('div');
      btn.className = `player-btn ${index === activePlayerIndex ? 'active' : ''}`;
      btn.onclick = () => switchPlayer(index);
      btn.innerHTML = `
        <div class="dot" style="background: ${p.hex}"></div>
        ${p.color}
      `;
      bar.appendChild(btn);
    });
  }

  function switchPlayer(index) {
    activePlayerIndex = index;
    renderPlayerBar();
    loadPlayerForm();
  }

  function loadPlayerForm() {
    const p = activePlayerIndex === -1
      ? { badges: { gold: [null, null], silver: [null, null, null] }, cargo: [], compostCount: 0, compostMult: 1 }
      : players[activePlayerIndex];

    rendercargo();
    renderBadgesUI();
    document.getElementById('compostCards').value = p.compostCount;
    setCompostMultUI(p.compostMult);
  }

  // 1. CARGO
 function addManifest() {
    const input = document.getElementById('cargoValue');
    const val = parseInt(input.value);
    // KOD RESETUJĄCY: Wpisanie 1234 zeruje całą grę
    if (val === 1234) {
      if (confirm("Reset all player scores to 0?")) {
        resetAllScores();
      }
      input.value = '';
      return;
    }
    // Standardowe dodawanie Cargo
    if (!isNaN(val) && val > -50) {
      players[activePlayerIndex].cargo.push(val);
      input.value = '';
      rendercargo();
      saveGameState();
    }
  }
  // Funkcja pomocnicza do czyszczenia całej gry
  function resetAllScores() {
    players = colors.map((c, i) => ({
      id: i,
      color: c.name,
      hex: c.hex,
      cargo: [],
      badges: {
        gold: [null, null],
        silver: [null, null, null]
      },
      compostCount: 0,
      compostMult: 1
    }));
    // Odświeżamy interfejs
    loadPlayerForm();
    calculateScores(false); // Czyści tabelę wyników
    // Zapisujemy wyczyszczoną grę w Firebase (wyczyści dane też u reszty graczy!)
//    saveGameState();
    console.log("Game reset successfully!");
  }

  function removeManifest(mIndex) {
    if (activePlayerIndex === -1) return;
    players[activePlayerIndex].cargo.splice(mIndex, 1);
    rendercargo();
//    saveGameState();
  }

  function rendercargo() {
    const list = document.getElementById('cargoList');
    list.innerHTML = '';
    const currentCargo = activePlayerIndex === -1 ? [] : players[activePlayerIndex].cargo;
    currentCargo.forEach((m, idx) => {
      list.innerHTML += `
        <div class="cargo-item">
          <span>📦 Cargo worth ${m} pts</span>
          <span class="remove-btn" onclick="removeManifest(${idx})">✖</span>
        </div>
      `;
    });
  }

  // 2. BADGES
  function renderBadgesUI() {
    const p = activePlayerIndex === -1
      ? { badges: { gold: [null, null], silver: [null, null, null] } }
      : players[activePlayerIndex];

    const goldContainer = document.getElementById('goldBadges');
    goldContainer.innerHTML = '';
    p.badges.gold.forEach((val, i) => {
      goldContainer.innerHTML += `
        <div class="badge-wrapper">
          <div class="badge-card gold">
            <img src="images/gold.png" class="medal">
            <input type="checkbox" ${val === 'first' ? 'checked' : ''} onclick="toggleBadge('gold', ${i}, 'first')">
          </div>
          <label><input type="checkbox" ${val === 'under' ? 'checked' : ''} onclick="toggleBadge('gold', ${i}, 'under')"></label>
        </div>
      `;
    });

    const silverContainer = document.getElementById('silverBadges');
    silverContainer.innerHTML = '';
    p.badges.silver.forEach((val, i) => {
      silverContainer.innerHTML += `
        <div class="badge-wrapper">
          <div class="badge-card silver">
            <img src="images/silver.png" class="medal">
            <input type="checkbox" ${val === 'first' ? 'checked' : ''} onclick="toggleBadge('silver', ${i}, 'first')">
          </div>
          <label><input type="checkbox" ${val === 'under' ? 'checked' : ''} onclick="toggleBadge('silver', ${i}, 'under')"></label>
        </div>
      `;
    });
  }

  function toggleBadge(type, badgeIdx, option) {
    const current = players[activePlayerIndex].badges[type][badgeIdx];
    players[activePlayerIndex].badges[type][badgeIdx] = (current === option) ? null : option;
    renderBadgesUI();
//    saveGameState();
  }

  // 3. COMPOST
  function updateCurrentPlayerCompost() {
    if (activePlayerIndex === -1) return;
    const val = parseInt(document.getElementById('compostCards').value) || 0;
    players[activePlayerIndex].compostCount = val;
//    saveGameState();
  }

  function setCompostMult(mult) {
    players[activePlayerIndex].compostMult = mult;
    setCompostMultUI(mult);
//    saveGameState();
  }

  function setCompostMultUI(mult) {
    const btns = document.querySelectorAll('.mult-btn');
    btns.forEach((btn, idx) => {
      btn.classList.toggle('selected', idx + 1 === mult);
    });
  }

  // CALCULATE
  function calculateScores(shouldSave = true) {
    if (activePlayerIndex !== -1) updateCurrentPlayerCompost();

    const scoredPlayers = players.map(p => {
      const cargoSum = p.cargo.reduce((a, b) => a + b, 0);
      let badgeSum = 0;
      p.badges.gold.forEach(g => {
        if (g === 'first') badgeSum += 10;
        if (g === 'under') badgeSum += 5;
      });
      p.badges.silver.forEach(s => {
        if (s === 'first') badgeSum += 5;
        if (s === 'under') badgeSum += 2;
      });
      const compostSum = p.compostCount * p.compostMult;

      return {
        color: p.color,
        hex: p.hex,
        cargo: cargoSum,
        badge: badgeSum,
        compost: compostSum,
        total: cargoSum + badgeSum + compostSum
      };
    });

    scoredPlayers.sort((a, b) => b.total - a.total);

    const body = document.getElementById('resultsBody');
    body.innerHTML = '';
    scoredPlayers.forEach((p) => {
      body.innerHTML += `
        <tr>
          <td style="color:white; background: ${p.hex}; font-weight: bold;">${p.color}</td>
          <td><b>${p.cargo}</b> pts</td>
          <td><b>${p.badge}</b> pts</td>
          <td><b>${p.compost}</b> pts</td>
          <td><b>${p.total}</b> pts</td>
        </tr>
      `;
    });

    document.getElementById('resultsSection').style.display = 'block';
    if (shouldSave) saveGameState();
  }

  init();
</script>
</body>
</html>
